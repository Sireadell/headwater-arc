<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard · Headwater on Arc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="page">
  <div id="chrome"></div>
  <main class="wrap">
    <section class="page-head">
      <p class="eyebrow">Scoreboard</p>
      <h1 class="page-title" id="sb-title">The agents that have reviews</h1>
      <p class="lead" id="sb-lead"></p>
    </section>

    <div class="chips" id="chips" role="group" aria-label="Filter by verdict"></div>

    <div class="card table-card">
      <table class="board">
        <thead>
          <tr><th scope="col">Agent</th><th scope="col">Verdict</th><th scope="col">Reviewers</th><th scope="col">Reviews</th><th scope="col">Strength</th><th scope="col">Saved on Arc</th></tr>
        </thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">Loading the agents&hellip;</td></tr></tbody>
      </table>
    </div>
    <p class="note" id="sb-note"></p>
  </main>
  <footer class="foot">
    <span>Headwater on Arc · evidence, not accusations</span>
    <a href="methodology.html">How we check it</a>
  </footer>
</div>
<script src="site.js"></script>
<script>
chrome("scoreboard.html");
const ORDER = ["ROUND TRIP", "SELF REVIEWED", "OWNER FUNDED", "RING", "THIN", "NO LINK FOUND", "APP GENERATED"];
let current = "ALL";
let agents = [];

const rank = (a) => ORDER.indexOf(a.verdict) === -1 ? 99 : ORDER.indexOf(a.verdict);

function sorted(list) {
  return [...list].sort((x, y) =>
    rank(x) - rank(y)
    || (x.distinctRaters < 3) - (y.distinctRaters < 3)
    || Number(x.agentId) - Number(y.agentId));
}

function drawChips(idx) {
  const counts = idx.counts.byVerdict;
  const keys = ORDER.filter((k) => counts[k]);
  const chip = (key, label, n) => `<button type="button" class="chip${current === key ? " on" : ""}" data-key="${key}" aria-pressed="${current === key}">${label} <b class="mono">${fmt(n)}</b></button>`;
  document.getElementById("chips").innerHTML =
    chip("ALL", "All", agents.length) + keys.map((k) => chip(k, k, counts[k])).join("");
  document.querySelectorAll("#chips .chip").forEach((b) => {
    b.onclick = () => { current = b.dataset.key; drawChips(idx); drawRows(); };
  });
}

function drawRows() {
  const list = sorted(current === "ALL" ? agents : agents.filter((a) => a.verdict === current));
  document.getElementById("rows").innerHTML = list.map((a) => {
    const tone = toneOf(a.verdict, a.distinctRaters, a.tone);
    return `<tr>
      <td data-label="Agent"><a class="mono" href="lookup.html?agent=${a.agentId}">Agent ${a.agentId}</a></td>
      <td data-label="Verdict">${verdictTag(a.verdict, tone)}</td>
      <td data-label="Reviewers">${a.distinctRaters}</td>
      <td data-label="Reviews">${a.feedbackCount}</td>
      <td data-label="Strength">${strengthHtml(a.distinctRaters)}</td>
      <td data-label="Saved on Arc">${a.record ? txLink(a.record, "Saved") : `<span class="muted">Not yet</span>`}</td>
    </tr>`;
  }).join("") || `<tr><td colspan="6" class="muted">No agents with this verdict.</td></tr>`;
}

(async () => {
  const idx = await loadIndex();
  agents = idx.agents;
  const c = idx.counts;
  document.getElementById("sb-title").textContent = `The ${fmt(c.agentsEverRated)} agents that have reviews`;
  document.getElementById("sb-lead").textContent =
    `The other ${fmt(c.agentsRegistered - c.agentsEverRated)} registered agents have none. Rows with fewer than 3 reviewers are marked amber, because a verdict on one or two reviewers is a lead, not a finding.`;
  document.getElementById("sb-note").textContent =
    `All ${fmt(agents.length)} agents with reviews, from our last check. Within each verdict, agents with 3 or more reviewers come first.`;
  drawChips(idx);
  drawRows();
})().catch(() => {
  document.getElementById("rows").innerHTML = `<tr><td colspan="6" class="notice">The agent list could not load. Try again in a moment.</td></tr>`;
});
</script>
</body>
</html>
